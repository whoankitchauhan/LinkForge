name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Lint & Test ─────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkforge
          POSTGRES_PASSWORD: linkforge_secret
          POSTGRES_DB: linkforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push DB schema (no migration files required)
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://linkforge:linkforge_secret@localhost:5432/linkforge_test

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://linkforge:linkforge_secret@localhost:5432/linkforge_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test_access_secret_ci_only
          JWT_REFRESH_SECRET: test_refresh_secret_ci_only
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          BASE_DOMAIN: linkforge.io
          APP_URL: http://localhost:3001
          PORT: 3001
          BCRYPT_ROUNDS: 4
          SHORT_CODE_LENGTH: 7
          CACHE_TTL: 3600

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://linkforge:linkforge_secret@localhost:5432/linkforge_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test_access_secret_ci_only
          JWT_REFRESH_SECRET: test_refresh_secret_ci_only
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          BASE_DOMAIN: linkforge.io
          APP_URL: http://localhost:3001
          PORT: 3001
          BCRYPT_ROUNDS: 4
          SHORT_CODE_LENGTH: 7
          CACHE_TTL: 3600

  # ─── Docker Build ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push — GHCR secrets optional)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/linkforge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
