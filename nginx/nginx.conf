events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Rate Limiting ──────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/m;
    limit_req_zone $binary_remote_addr zone=redirect:10m rate=200r/m;

    # ── Upstream ───────────────────────────────────────────────────────────────
    upstream linkforge_app {
        server app:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name linkforge.io www.linkforge.io localhost;

        # Redirect HTTP → HTTPS in production
        # return 301 https://$host$request_uri;

        # ── Security Headers ───────────────────────────────────────────────────
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Max request body
        client_max_body_size 1m;

        # ── Static Files ───────────────────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            proxy_pass http://linkforge_app;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── API Routes ─────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://linkforge_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Health & Metrics (internal only) ───────────────────────────────────
        location /health {
            proxy_pass http://linkforge_app;
            access_log off;
        }

        location /metrics {
            # Restrict to internal/monitoring network
            allow 172.0.0.0/8;
            deny all;
            proxy_pass http://linkforge_app;
        }

        # ── Short URL Redirects ────────────────────────────────────────────────
        location ~* ^/[a-zA-Z0-9_-]{3,50}$ {
            limit_req zone=redirect burst=50 nodelay;
            proxy_pass http://linkforge_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Default ────────────────────────────────────────────────────────────
        location / {
            proxy_pass http://linkforge_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
